# Google Cloud Run service definition for the EchoTrack FastAPI backend.
#
# Deploy with:
#   gcloud run services replace infra/cloudrun/service.yaml \
#     --region=us-central1 \
#     --project=<GCP_PROJECT_ID>
#
# Required GCP Secret Manager secrets (create once with `gcloud secrets create`):
#   echotrack-database-url
#   echotrack-supabase-url
#   echotrack-supabase-publishable-key
#   echotrack-supabase-secret-key
#
# Required substitution before deploying:
#   Replace <GCP_PROJECT_ID> and <IMAGE> with real values, or use the
#   deploy-cloudrun.sh / GitHub Actions workflow which handles substitution.

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: echotrack-backend
  annotations:
    # Allow unauthenticated invocations (public API — auth is enforced at the
    # application layer via Supabase JWT verification).
    run.googleapis.com/ingress: all
labels:
  app: echotrack
spec:
  template:
    metadata:
      annotations:
        # Scale to zero when idle to minimise cost.
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        # Allow up to 80 concurrent requests per instance (FastAPI async).
        run.googleapis.com/cpu-throttling: "false"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: IMAGE_PLACEHOLDER  # replaced by CI/CD or deploy script
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: APP_ENV
              value: "prod"
            # Non-sensitive runtime config
            - name: CORS_ORIGINS
              value: ""  # Set to comma-separated list, e.g. https://echotrack.pages.dev
            # Secrets — loaded from GCP Secret Manager at container start-up.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: echotrack-database-url
                  key: latest
            - name: SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  name: echotrack-supabase-url
                  key: latest
            - name: SUPABASE_PUBLISHABLE_KEY
              valueFrom:
                secretKeyRef:
                  name: echotrack-supabase-publishable-key
                  key: latest
            - name: SUPABASE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: echotrack-supabase-secret-key
                  key: latest
          # Liveness / startup probe — Cloud Run uses this to route traffic.
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12  # 60 s total for migrations to finish
