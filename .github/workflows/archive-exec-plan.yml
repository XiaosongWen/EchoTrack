name: Archive Exec Plan on Merge

on:
  pull_request:
    types: [closed]
    branches: [ "master", "main" ]
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number to archive (e.g. 100)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: read

jobs:
  archive-exec-plan:
    name: Archive Active Execution Plan
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Archive Script
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          EXPLICIT_ISSUE: ${{ github.event.inputs.issue }}
        run: |
          python3 .github/scripts/archive_exec_plan.py \
            --branch "$PR_BRANCH" \
            --title "$PR_TITLE" \
            --body "$PR_BODY" \
            --issue "$EXPLICIT_ISSUE"

      - name: Commit and Push Archived Plans
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add agents/exec-plan/
            COMMIT_MSG="chore(docs): auto-archive execution plan"
            if [ -n "${{ github.event.pull_request.number }}" ]; then
              COMMIT_MSG="$COMMIT_MSG for PR #${{ github.event.pull_request.number }}"
            fi
            COMMIT_MSG="$COMMIT_MSG [skip ci]"
            git commit -m "$COMMIT_MSG"
            git push
            echo "Archived execution plans pushed successfully."
          else
            echo "No active execution plans found matching this issue."
          fi
