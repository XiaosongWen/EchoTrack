name: Deploy Backend to Cloud Run

# Trigger on pushes to master when backend or infra files change,
# or manually via workflow_dispatch.
on:
  push:
    branches: [master, main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-cloudrun.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (defaults to git SHA)"
        required: false
        default: ""

env:
  DOCKERHUB_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/echotrack-backend
  SERVICE_NAME: echotrack-backend
  GCP_REGION: us-central1

jobs:
  deploy:
    name: Build & Deploy to Cloud Run
    runs-on: ubuntu-latest
    # Required for Workload Identity Federation token exchange.
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Determine Image Tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.image_tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_SHA::7}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      # ── Build & push to Docker Hub ────────────────────────────────────────────
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.DOCKERHUB_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Authenticate to GCP via Workload Identity Federation ─────────────────
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # ── Deploy new revision (tagged "candidate") ──────────────────────────────
      # On an existing service the revision gets 0% traffic so the old one keeps
      # serving. --no-traffic is rejected by gcloud when *creating* a service, so
      # the very first deploy goes live directly (there is nothing to protect yet).
      - name: Deploy New Revision
        id: deploy
        run: |
          set -euo pipefail
          SVC="${{ env.SERVICE_NAME }}"
          REGION="${{ env.GCP_REGION }}"
          PROJECT="${{ secrets.GCP_PROJECT_ID }}"

          TRAFFIC_FLAG=""
          if gcloud run services describe "$SVC" --region="$REGION" --project="$PROJECT" >/dev/null 2>&1; then
            TRAFFIC_FLAG="--no-traffic"
          else
            echo "Service does not exist yet — first deploy goes live directly."
          fi

          # '^@^' makes '@' the list delimiter so CORS_ORIGINS may contain commas.
          gcloud run deploy "$SVC" \
            --image="${{ env.DOCKERHUB_IMAGE }}:${{ steps.tag.outputs.tag }}" \
            --region="$REGION" \
            --project="$PROJECT" \
            --tag=candidate ${TRAFFIC_FLAG} \
            --set-env-vars="^@^APP_ENV=prod@CORS_ORIGINS=${{ secrets.CORS_ORIGINS }}" \
            --set-secrets="DATABASE_URL=echotrack-database-url:latest,SUPABASE_URL=echotrack-supabase-url:latest,SUPABASE_PUBLISHABLE_KEY=echotrack-supabase-publishable-key:latest,SUPABASE_SECRET_KEY=echotrack-supabase-secret-key:latest" \
            --service-account="${{ secrets.GCP_SERVICE_ACCOUNT }}" \
            --min-instances=0 \
            --max-instances=10 \
            --concurrency=80 \
            --cpu=1 \
            --memory=512Mi \
            --port=8080 \
            --timeout=300 \
            --allow-unauthenticated

          # URL of the tagged revision (reachable even at 0% traffic).
          CANDIDATE_URL=$(gcloud run services describe "$SVC" \
            --region="$REGION" --project="$PROJECT" --format=json \
            | jq -r '.status.traffic[] | select(.tag=="candidate") | .url')
          if [ -z "$CANDIDATE_URL" ] || [ "$CANDIDATE_URL" = "null" ]; then
            echo "❌ Could not find the candidate revision URL."
            exit 1
          fi
          echo "candidate_url=${CANDIDATE_URL}" >> "$GITHUB_OUTPUT"
          echo "Candidate URL: ${CANDIDATE_URL}"

      # ── Smoke-test the NEW revision directly (old revision still serving) ─────
      - name: Smoke Test New Revision
        run: |
          URL="${{ steps.deploy.outputs.candidate_url }}/api/v1/health"
          for i in $(seq 1 12); do
            HTTP_STATUS=$(curl -s -o /tmp/health_body.txt -w "%{http_code}" "$URL" || true)
            if [ "${HTTP_STATUS}" = "200" ]; then
              echo "✅ Health check passed (HTTP 200)."
              cat /tmp/health_body.txt
              exit 0
            fi
            echo "Attempt ${i}/12 — HTTP ${HTTP_STATUS}, retrying in 5 s..."
            sleep 5
          done
          echo "❌ Health check failed after 60 s — traffic NOT migrated."
          exit 1

      # ── Migrate traffic ONLY after a successful smoke test ────────────────────
      - name: Migrate Traffic to New Revision
        run: |
          gcloud run services update-traffic ${{ env.SERVICE_NAME }} \
            --region="${{ env.GCP_REGION }}" \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --to-latest \
            --remove-tags=candidate
          echo "✅ Traffic migrated to the new revision."

      - name: Report Failure
        if: failure()
        run: |
          echo "⚠️  Deployment failed. If the service already existed, the previous revision is still serving 100% traffic."
          echo "Investigate with:"
          echo "  gcloud run revisions list --service=${{ env.SERVICE_NAME }} --region=${{ env.GCP_REGION }} --project=${{ secrets.GCP_PROJECT_ID }}"
