name: Deploy Backend to Cloud Run

# Trigger on pushes to master when backend or infra files change,
# or manually via workflow_dispatch.
on:
  push:
    branches: [master, main]
    paths:
      - "backend/**"
      - "infra/cloudrun/**"
      - ".github/workflows/deploy-cloudrun.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (defaults to git SHA)"
        required: false
        default: ""

env:
  DOCKERHUB_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/echotrack-backend
  SERVICE_NAME: echotrack-backend
  GCP_REGION: us-central1

jobs:
  deploy:
    name: Build & Deploy to Cloud Run
    runs-on: ubuntu-latest
    # Required for Workload Identity Federation token exchange.
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Determine Image Tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.image_tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_SHA::7}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      # ── Build & push to Docker Hub ────────────────────────────────────────────
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.DOCKERHUB_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Authenticate to GCP via Workload Identity Federation ─────────────────
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # ── Declarative Cloud Run deploy ──────────────────────────────────────────
      - name: Deploy to Cloud Run
        run: |
          FULL_IMAGE="${{ env.DOCKERHUB_IMAGE }}:${{ steps.tag.outputs.tag }}"
          sed "s|IMAGE_PLACEHOLDER|${FULL_IMAGE}|g" infra/cloudrun/service.yaml \
            | gcloud run services replace - \
                --region="${{ env.GCP_REGION }}" \
                --project="${{ secrets.GCP_PROJECT_ID }}"

      - name: Set CORS Origins
        run: |
          gcloud run services update ${{ env.SERVICE_NAME }} \
            --region="${{ env.GCP_REGION }}" \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --update-env-vars "CORS_ORIGINS=${{ secrets.CORS_ORIGINS }}"

      # Make service publicly invocable (app-level auth via Supabase JWT)
      - name: Allow Public Invocations
        run: |
          gcloud run services add-iam-policy-binding ${{ env.SERVICE_NAME }} \
            --region="${{ env.GCP_REGION }}" \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --member="allUsers" \
            --role="roles/run.invoker" \
            --quiet || true

      # ── Smoke-test the deployed service ──────────────────────────────────────
      - name: Verify Health Endpoint
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region="${{ env.GCP_REGION }}" \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --format="value(status.url)")
          echo "Service URL: ${SERVICE_URL}"
          # Retry for up to 60 s while the new revision warms up.
          for i in $(seq 1 12); do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${SERVICE_URL}/api/v1/health")
            if [ "${HTTP_STATUS}" = "200" ]; then
              echo "Health check passed (HTTP 200)."
              exit 0
            fi
            echo "Attempt ${i}/12 — got HTTP ${HTTP_STATUS}, retrying in 5 s..."
            sleep 5
          done
          echo "Health check failed after 60 s."
          exit 1
