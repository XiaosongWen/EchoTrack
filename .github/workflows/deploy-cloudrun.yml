name: Deploy Backend to Cloud Run

# Trigger on pushes to master when backend or infra files change,
# or manually via workflow_dispatch.
on:
  push:
    branches: [master, main]
    paths:
      - "backend/**"
      - "infra/cloudrun/**"
      - ".github/workflows/deploy-cloudrun.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (defaults to git SHA)"
        required: false
        default: ""

env:
  DOCKERHUB_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/echotrack-backend
  SERVICE_NAME: echotrack-backend
  GCP_REGION: us-central1

jobs:
  deploy:
    name: Build & Deploy to Cloud Run
    runs-on: ubuntu-latest
    # Required for Workload Identity Federation token exchange.
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Determine Image Tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.image_tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_SHA::7}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      # ── Build & push to Docker Hub ────────────────────────────────────────────
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.DOCKERHUB_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Authenticate to GCP via Workload Identity Federation ─────────────────
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # ── Deploy new revision with NO traffic (old revision keeps serving) ────────
      - name: Deploy New Revision (no traffic)
        run: |
          FULL_IMAGE="${{ env.DOCKERHUB_IMAGE }}:${{ steps.tag.outputs.tag }}"
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image="${FULL_IMAGE}" \
            --region="${{ env.GCP_REGION }}" \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --no-traffic \
            --set-env-vars="APP_ENV=prod,CORS_ORIGINS=${{ secrets.CORS_ORIGINS }}" \
            --set-secrets="\
              DATABASE_URL=echotrack-database-url:latest,\
              SUPABASE_URL=echotrack-supabase-url:latest,\
              SUPABASE_PUBLISHABLE_KEY=echotrack-supabase-publishable-key:latest,\
              SUPABASE_SECRET_KEY=echotrack-supabase-secret-key:latest" \
            --service-account="${{ secrets.GCP_SERVICE_ACCOUNT }}" \
            --min-instances=0 \
            --max-instances=10 \
            --concurrency=80 \
            --cpu=1 \
            --memory=512Mi \
            --port=8080 \
            --timeout=300 \
            --format="value(status.latestCreatedRevisionName)" \
            | tee /tmp/new_revision.txt
          echo "new_revision=$(cat /tmp/new_revision.txt)" >> $GITHUB_ENV

      # Make service publicly invocable (idempotent — safe to run every deploy)
      - name: Allow Public Invocations
        run: |
          gcloud run services add-iam-policy-binding ${{ env.SERVICE_NAME }} \
            --region="${{ env.GCP_REGION }}" \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --member="allUsers" \
            --role="roles/run.invoker" \
            --quiet || true

      # ── Smoke-test the NEW revision directly (old revision still serving) ─────
      - name: Smoke Test New Revision
        run: |
          # Get the URL for the specific new revision (not the service URL which
          # still points at the old revision while --no-traffic is in effect).
          REVISION_URL=$(gcloud run revisions describe "${{ env.new_revision }}" \
            --region="${{ env.GCP_REGION }}" \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --format="value(status.url)" 2>/dev/null || true)

          # Fallback: use service URL with revision header (always works)
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region="${{ env.GCP_REGION }}" \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --format="value(status.url)")
          TEST_URL="${REVISION_URL:-$SERVICE_URL}"

          echo "Smoke testing revision: ${{ env.new_revision }}"
          echo "Test URL: ${TEST_URL}/api/v1/health"

          # Retry up to 60 s for the new revision to warm up.
          for i in $(seq 1 12); do
            HTTP_STATUS=$(curl -s -o /tmp/health_body.txt -w "%{http_code}" \
              -H "Authorization: Bearer $(gcloud auth print-identity-token)" \
              "${TEST_URL}/api/v1/health")
            if [ "${HTTP_STATUS}" = "200" ]; then
              echo "✅ Health check passed (HTTP 200). Revision is healthy."
              cat /tmp/health_body.txt
              exit 0
            fi
            echo "Attempt ${i}/12 — HTTP ${HTTP_STATUS}, retrying in 5 s..."
            sleep 5
          done

          echo "❌ Health check failed after 60 s — keeping old revision live."
          exit 1

      # ── Migrate traffic ONLY after successful smoke test ──────────────────────
      - name: Migrate Traffic to New Revision
        run: |
          gcloud run services update-traffic ${{ env.SERVICE_NAME }} \
            --region="${{ env.GCP_REGION }}" \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --to-latest
          echo "✅ Traffic migrated to ${{ env.new_revision }}"

      # ── Rollback on failure ───────────────────────────────────────────────────
      - name: Rollback on Failure
        if: failure()
        run: |
          echo "⚠️  Deployment failed — old revision is still serving 100% traffic."
          echo "New revision ${{ env.new_revision }} received no traffic."
          echo "To manually rollback or investigate:"
          echo "  gcloud run revisions list --service=${{ env.SERVICE_NAME }} --region=${{ env.GCP_REGION }} --project=${{ secrets.GCP_PROJECT_ID }}"
